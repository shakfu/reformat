[package]
name = "reformat"
version.workspace = true
edition.workspace = true
# Higher than the workspace floor: simplelog -> time requires 1.88.
rust-version = "1.88"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for text and file reformatting"
readme = "../README.md"

[[bin]]
name = "reformat"
path = "src/main.rs"

[dependencies]
reformat-core.workspace = true

clap = { version = "4.5", features = ["derive"] }
anyhow.workspace = true
serde_json.workspace = true

# Logging and UI
log.workspace = true
simplelog.workspace = true
logging_timer.workspace = true

# File selection, diffs, EditorConfig, completions and the man page.
# CLI-only: `ignore` needs Rust 1.88, above the library's floor.
ignore = "0.4"
similar = "2"
ec4rs = "1"
clap_complete = "4"
clap_mangen = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
