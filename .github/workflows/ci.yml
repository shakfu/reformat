name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tool manipulates filenames and case, and carries an explicit
  # case-insensitive-filesystem branch in the renamer. Testing only on Linux
  # left that branch, and every path-separator assumption, unexercised.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Each declared MSRV must actually build, or users on an older toolchain get
  # a confusing compile error instead of a clear version message. The floors
  # differ: reformat-core is usable from 1.82, but the CLI's dependency tree
  # (simplelog -> time) needs 1.88. The library check omits --all-targets
  # because dev-dependencies are not part of a consumer's build.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.82"
            args: "-p reformat-core"
          - toolchain: "1.88"
            args: "--workspace --all-targets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.args }}

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # LTO and codegen-units=1 can surface errors a debug build does not.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
